name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Permixa.slnx

      - name: Build (Release)
        run: dotnet build Permixa.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test Permixa.slnx -c Release --no-build --verbosity minimal

      - name: Pack (Release)
        run: |
          mkdir -p artifacts/ci-pack
          dotnet pack Permixa.Domain/Permixa.Domain.csproj -c Release -o artifacts/ci-pack --no-build
          dotnet pack Permixa.Application/Permixa.Application.csproj -c Release -o artifacts/ci-pack --no-build
          dotnet pack Permixa.Infrastructure/Permixa.Infrastructure.csproj -c Release -o artifacts/ci-pack --no-build
          dotnet pack Permixa.AspNetCore/Permixa.AspNetCore.csproj -c Release -o artifacts/ci-pack --no-build
          dotnet pack Permixa.Caching.Redis/Permixa.Caching.Redis.csproj -c Release -o artifacts/ci-pack --no-build
          dotnet pack Permixa.Email.Resend/Permixa.Email.Resend.csproj -c Release -o artifacts/ci-pack --no-build
          dotnet pack Permixa.Templates/Permixa.Templates.csproj -c Release -o artifacts/ci-pack

      - name: Inspect package graphs
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $ver = ([regex]::Match((Get-Content Directory.Build.props -Raw), '<PackageVersion>([^<]+)</PackageVersion>')).Groups[1].Value
          if (-not $ver) { throw 'Could not read PackageVersion from Directory.Build.props' }
          function Get-Nuspec([string]$path) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $path))
            try {
              $entry = $zip.Entries | Where-Object { $_.Name -like '*.nuspec' } | Select-Object -First 1
              $reader = New-Object System.IO.StreamReader($entry.Open())
              $text = $reader.ReadToEnd()
              $reader.Close()
              return $text
            } finally { $zip.Dispose() }
          }
          function Assert-Icon([string]$path) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $path))
            try {
              $icon = $zip.Entries | Where-Object { $_.FullName -eq 'permixa-icon.png' -or $_.Name -eq 'permixa-icon.png' } | Select-Object -First 1
              if (-not $icon) { throw "Missing permixa-icon.png inside $path" }
            } finally { $zip.Dispose() }
            $nuspec = Get-Nuspec $path
            if ($nuspec -notmatch '<icon>permixa-icon\.png</icon>') {
              throw "PackageIcon metadata missing/wrong in $path"
            }
          }
          $asp = Get-Nuspec "artifacts/ci-pack/Permixa.AspNetCore.$ver.nupkg"
          if ($asp -match 'StackExchange.Redis' -or $asp -match 'id="Resend"') {
            throw 'Permixa.AspNetCore must not depend on StackExchange.Redis or Resend'
          }
          $redis = Get-Nuspec "artifacts/ci-pack/Permixa.Caching.Redis.$ver.nupkg"
          if ($redis -notmatch 'StackExchange.Redis') { throw 'Redis package missing StackExchange.Redis' }
          if ($redis -match 'id="Resend"') { throw 'Redis package must not depend on Resend' }
          $resend = Get-Nuspec "artifacts/ci-pack/Permixa.Email.Resend.$ver.nupkg"
          if ($resend -notmatch 'id="Resend"') { throw 'Resend package missing Resend dependency' }
          if ($resend -match 'StackExchange.Redis') { throw 'Resend package must not depend on Redis' }
          if (-not (Test-Path "artifacts/ci-pack/Permixa.Templates.$ver.nupkg")) {
            throw 'Permixa.Templates nupkg missing'
          }
          foreach ($id in @(
            'Permixa.Domain','Permixa.Application','Permixa.Infrastructure',
            'Permixa.AspNetCore','Permixa.Caching.Redis','Permixa.Email.Resend','Permixa.Templates'
          )) {
            Assert-Icon "artifacts/ci-pack/$id.$ver.nupkg"
          }
          Write-Host "Package graph + icon inspection OK ($ver)"

      # Intentionally no nuget push / release / tagging steps.

  template-validation:
    name: Template instantiate and validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: build-test-pack

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Pack local RC feed (framework + templates)
        run: |
          set -euo pipefail
          mkdir -p artifacts/local-rc
          # Local feed required until preview.2 exists on nuget.org (consumer pins match Directory.Build.props).
          dotnet pack Permixa.Domain/Permixa.Domain.csproj -c Release -o artifacts/local-rc
          dotnet pack Permixa.Application/Permixa.Application.csproj -c Release -o artifacts/local-rc
          dotnet pack Permixa.Infrastructure/Permixa.Infrastructure.csproj -c Release -o artifacts/local-rc
          dotnet pack Permixa.AspNetCore/Permixa.AspNetCore.csproj -c Release -o artifacts/local-rc
          dotnet pack Permixa.Caching.Redis/Permixa.Caching.Redis.csproj -c Release -o artifacts/local-rc
          dotnet pack Permixa.Email.Resend/Permixa.Email.Resend.csproj -c Release -o artifacts/local-rc
          dotnet pack Permixa.Templates/Permixa.Templates.csproj -c Release -o artifacts/local-rc

      - name: Install template package
        run: |
          set -euo pipefail
          VER="$(grep -oP '(?<=<PackageVersion>)[^<]+' Directory.Build.props | head -n1)"
          dotnet new uninstall Permixa.Templates || true
          dotnet new install "artifacts/local-rc/Permixa.Templates.${VER}.nupkg"

      - name: Validate all variants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'artifacts/template-validation'
          $feed = (Resolve-Path 'artifacts/local-rc').Path
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          # Parent NuGet.config so template post-action restore sees local RC before nuget.org.
          function Write-LocalRcNugetConfig([string]$dir, [string]$feedPath) {
            $xml = @(
              '<?xml version="1.0" encoding="utf-8"?>',
              '<configuration>',
              '  <packageSources>',
              '    <clear />',
              "    <add key=`"local-rc`" value=`"$feedPath`" />",
              '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />',
              '  </packageSources>',
              '</configuration>'
            ) -join [Environment]::NewLine
            Set-Content -Path (Join-Path $dir 'NuGet.config') -Value $xml -Encoding utf8
          }
          Write-LocalRcNugetConfig $root $feed

          function Assert-NoForbidden([string]$path) {
            $files = Get-ChildItem -Recurse -File $path | Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
            $hits = @()
            foreach ($f in $files) {
              $hits += Select-String -Path $f.FullName -Pattern 'PermixaApp|Company\.PermixaApp' -ErrorAction SilentlyContinue
            }
            if ($hits.Count -gt 0) {
              $hits | ForEach-Object { Write-Host $_.Path ':' $_.Line.Trim() }
              throw "Forbidden leftover identifiers found under $path"
            }
          }

          function Assert-PackagePin([string]$packagesProps) {
            $text = Get-Content $packagesProps -Raw
            if ($text -notmatch 'Permixa\.AspNetCore"\s+Version="0\.1\.0-preview\.2"') {
              throw "Permixa version pin missing/skew in $packagesProps"
            }
            if ($text -match '0\.1\.0-preview\.1') {
              throw "Stale preview.1 pin in $packagesProps"
            }
          }

          function Assert-NoProjectRefToPermixa([string]$dir) {
            $hits = Select-String -Path (Get-ChildItem -Recurse -Filter '*.csproj' $dir).FullName -Pattern 'Permixa\.(Domain|Application|Infrastructure|AspNetCore).*csproj|ProjectReference.*Permixa'
            if ($hits) { $hits | ForEach-Object { Write-Host $_ }; throw "Local Permixa ProjectReference found" }
          }

          $variants = @(
            @{ Name = 'ClinicSystem'; Args = @() },
            @{ Name = 'ClinicRedis'; Args = @('--redis') },
            @{ Name = 'ClinicEmail'; Args = @('--resend') },
            @{ Name = 'ClinicFull'; Args = @('--redis','--resend') }
          )

          foreach ($v in $variants) {
            $out = Join-Path $root $v.Name
            if (Test-Path $out) { Remove-Item -Recurse -Force $out }
            Write-Host "=== Generating $($v.Name) $($v.Args -join ' ') ==="
            & dotnet new permixa-app -n $v.Name -o $out @($v.Args)
            Write-LocalRcNugetConfig $out $feed
            Assert-PackagePin (Join-Path $out 'Directory.Packages.props')
            Assert-NoProjectRefToPermixa $out
            Assert-NoForbidden $out

            $csproj = Join-Path $out "src/$($v.Name).Api/$($v.Name).Api.csproj"
            $csprojText = Get-Content $csproj -Raw
            $hasRedis = $csprojText -match 'Permixa\.Caching\.Redis'
            $hasResend = $csprojText -match 'Permixa\.Email\.Resend'
            $expectRedis = $v.Args -contains '--redis'
            $expectResend = $v.Args -contains '--resend'
            if ($hasRedis -ne $expectRedis) { throw "Redis PackageReference mismatch for $($v.Name)" }
            if ($hasResend -ne $expectResend) { throw "Resend PackageReference mismatch for $($v.Name)" }

            Push-Location $out
            try {
              dotnet restore
              if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed for $($v.Name)" }
              # Inspect Api assets (Domain has no Permixa PackageReference).
              $assetsPath = Join-Path $out "src/$($v.Name).Api/obj/project.assets.json"
              if (-not (Test-Path $assetsPath)) {
                throw "Missing project.assets.json for $($v.Name).Api"
              }
              $assetsText = Get-Content $assetsPath -Raw
              if ($assetsText -notmatch 'Permixa\.AspNetCore/0\.1\.0-preview\.2') {
                throw "Generated project did not restore Permixa.AspNetCore 0.1.0-preview.2"
              }
              if ($assetsText -match '0\.1\.0-preview\.1') {
                throw "Stale preview.1 resolved in $($v.Name).Api assets"
              }
              dotnet build -c Release --no-restore
              if ($LASTEXITCODE -ne 0) { throw "dotnet build failed for $($v.Name)" }
              dotnet test -c Release --no-build --verbosity minimal
              if ($LASTEXITCODE -ne 0) { throw "dotnet test failed for $($v.Name)" }
            } finally {
              Pop-Location
            }
          }

          # Rename-focused names
          foreach ($name in @('HealthPortal','Acme.Identity.Api')) {
            $out = Join-Path $root ("rename-" + ($name -replace '\.','-'))
            if (Test-Path $out) { Remove-Item -Recurse -Force $out }
            Write-Host "=== Rename check $name ==="
            & dotnet new permixa-app -n $name -o $out
            Write-LocalRcNugetConfig $out $feed
            Assert-NoForbidden $out
            Push-Location $out
            try {
              dotnet restore
              dotnet build -c Release --no-restore
            } finally {
              Pop-Location
            }
          }

          Write-Host 'Template validation OK (local RC feed)'
