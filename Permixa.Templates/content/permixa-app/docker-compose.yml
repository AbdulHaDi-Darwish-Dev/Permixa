services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: PermixaApp-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_DevOnly_Password123}"
    ports:
      - "1433:1433"
    volumes:
      - PermixaApp_sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD:-Your_strong_DevOnly_Password123}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

#if (redis)
  redis:
    image: redis:7-alpine
    container_name: PermixaApp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
#endif

volumes:
  PermixaApp_sql_data:
