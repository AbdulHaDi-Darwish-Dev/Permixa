<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#222;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f4f5;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e5e5e5;">
          <tr>
            <td style="padding:28px 28px 8px;">
              {{LogoBlock}}
              <h1 style="margin:0;font-size:22px;line-height:1.3;font-weight:700;">{{ApplicationName}}</h1>
              {{CompanyBlock}}
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 28px;">
              <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">Use this verification code to confirm your email address:</p>
              <p style="margin:0 0 16px;font-size:28px;letter-spacing:4px;font-weight:700;text-align:center;">{{VerificationCode}}</p>
              <p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:#555;">This code expires in {{ExpirationMinutes}} minutes.</p>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#666;">If you did not request this code, you can ignore this email.</p>
              {{SupportBlock}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
